function shufflePick(arr, n) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, n);
}

// Picks n exercises across a priority-ordered list of pools (e.g. [narrow
// muscle-focus pool, wider theme pool]), preferring distinct movement
// patterns so two exercises of the same type (e.g. two squats) don't end up
// in the same block. Only widens to the next pool — and only repeats a
// pattern — once every pool has been tried without finding something new.
// avoidFirstPattern additionally keeps the very first pick different from
// whatever pattern immediately preceded this selection (e.g. the last
// exercise of the previous block).
function pickDiverseFromPools(pools, n, avoidFirstPattern = null) {
  const chosen = [];
  const usedPatterns = new Set();
  const usedNames = new Set();

  for (const pool of pools) {
    if (chosen.length >= n) break;
    const shuffled = shufflePick(pool, pool.length);
    for (const ex of shuffled) {
      if (chosen.length >= n) break;
      if (usedNames.has(ex.name)) continue;
      const p = detectPattern(ex.name, ex.group);
      if (!usedPatterns.has(p)) {
        chosen.push(ex);
        usedPatterns.add(p);
        usedNames.add(ex.name);
      }
    }
  }
  if (chosen.length < n) {
    for (const pool of pools) {
      if (chosen.length >= n) break;
      for (const ex of pool) {
        if (chosen.length >= n) break;
        if (usedNames.has(ex.name)) continue;
        chosen.push(ex);
        usedNames.add(ex.name);
      }
    }
  }
  if (avoidFirstPattern && chosen.length > 1 && detectPattern(chosen[0].name, chosen[0].group) === avoidFirstPattern) {
    const swapIdx = chosen.findIndex((e, i) => i > 0 && detectPattern(e.name, e.group) !== avoidFirstPattern);
    if (swapIdx > 0) [chosen[0], chosen[swapIdx]] = [chosen[swapIdx], chosen[0]];
  }
  return chosen;
}

const WORK_TIME_SECONDS = 45;

function levelSetsReps(level, format = "reps") {
  if (format === "time") {
    const sets = level === "Початковий" ? 2 : level === "Просунутий" ? 4 : 3;
    return { sets, reps: `${WORK_TIME_SECONDS} сек` };
  }
  if (level === "Початковий") return { sets: 2, reps: "12-15" };
  if (level === "Просунутий") return { sets: 4, reps: "10-12" };
  return { sets: 3, reps: "12-15" };
}

// Decides which format a given block uses. "mixed" alternates block-by-block
// so the workout genuinely contains both time-based and rep-based blocks.
function blockFormatFor(workFormat, blockIndex) {
  if (workFormat === "time") return "time";
  if (workFormat === "mixed") return blockIndex % 2 === 0 ? "reps" : "time";
  return "reps";
}

// Infers whether an existing block is reps- or time-based by inspecting its
// exercises, so a replacement exercise can match the same format.
function inferBlockValueFormat(block, fallback = "reps") {
  const withValue = block?.exercises?.find((e) => e && e.reps);
  if (!withValue) return fallback;
  return /сек/.test(withValue.reps) ? "time" : "reps";
}

// Detects "reps" values that aren't a normal number or range (e.g. "12" or
// "12-15") — things like a ladder scheme "2-4-6-8-10", a pyramid scheme
// "2-4-6-8-10-8-6-4-2", or Tabata's "макс". These must be preserved exactly
// when an exercise is replaced, rather than regenerated as a plain rep range.
function specialRepsScheme(reps) {
  if (!reps) return null;
  if (/сек$/.test(reps)) return null; // time-based, handled separately
  if (/^\d+(-\d+)?$/.test(reps)) return null; // plain number or simple "12-15" range
  return reps;
}

function equipmentPool(equipment) {
  return equipment.length ? equipment : ["Без інвентаря"];
}

function filterLibrary(groups, equipment, exclude = []) {
  const allowed = equipmentPool(equipment);
  return EXERCISE_LIBRARY.filter(
    (ex) => groups.includes(ex.group) && ex.eq.some((e) => allowed.includes(e)) && !exclude.includes(ex.name)
  );
}

const PATTERN_LABELS_UK = {
  squat: "присід", hinge: "тазостегновий нахил", push: "жим", pull: "тяга",
  core: "кор", plyo: "вибухові", carry: "перенесення", stretch: "розтяжка", full: "комплексні",
};

// Assigns each block a single coherent focus (one muscle group, or — for
// single-group themes — one movement pattern within that group) so exercises
// within a block, and across blocks, follow a logical structure rather than
// a random mix.
function getBlockFocuses(theme, count) {
  const baseGroups = THEME_GROUPS[theme] || ["Full Body"];
  if (baseGroups.length > 1) {
    // Rotate the group order to a random starting point each time. Without
    // this, a fixed order + fewer blocks than groups (e.g. 2-3 blocks vs 5
    // groups for Full Body) always lands on the same first groups (Ноги,
    // Верх) and never reaches Прес, Функціональне, Сідниці.
    const offset = Math.floor(Math.random() * baseGroups.length);
    const groups = baseGroups.map((_, i) => baseGroups[(i + offset) % baseGroups.length]);
    return Array.from({ length: count }, (_, i) => groups[i % groups.length]);
  }
  const group = baseGroups[0];
  const patternsPresent = [...new Set(EXERCISE_LIBRARY.filter((e) => e.group === group).map((e) => detectPattern(e.name, e.group)))];
  const order = patternsPresent.length ? patternsPresent : ["full"];
  return Array.from({ length: count }, (_, i) => ({ group, pattern: order[i % order.length] }));
}

function focusLabel(focus) {
  return typeof focus === "string" ? focus : `${focus.group} — ${PATTERN_LABELS_UK[focus.pattern] || focus.pattern}`;
}

function filterLibraryByFocus(focus, equipment, exclude = []) {
  const allowed = equipmentPool(equipment);
  if (typeof focus === "string") {
    return EXERCISE_LIBRARY.filter((e) => e.group === focus && e.eq.some((x) => allowed.includes(x)) && !exclude.includes(e.name));
  }
  return EXERCISE_LIBRARY.filter((e) => e.group === focus.group && detectPattern(e.name, e.group) === focus.pattern && e.eq.some((x) => allowed.includes(x)) && !exclude.includes(e.name));
}

// Parses a block's assigned focus back out of its own name, e.g. "Блок 2: Сідниці"
// or "Блок 3: TRX — кор", so a replaced exercise can be matched to the same focus.
function inferBlockFocus(blockName, theme) {
  if (!blockName) return null;
  const label = blockName.split(":").slice(1).join(":").trim();
  if (!label) return null;
  if (MUSCLE_GROUPS.includes(label)) return label;
  const [groupPart, patternPart] = label.split("—").map((s) => s && s.trim());
  if (groupPart && MUSCLE_GROUPS.includes(groupPart) && patternPart) {
    const patternKey = Object.keys(PATTERN_LABELS_UK).find((k) => PATTERN_LABELS_UK[k] === patternPart);
    if (patternKey) return { group: groupPart, pattern: patternKey };
  }
  const groups = THEME_GROUPS[theme] || [];
  for (const g of groups) {
    if (label.includes(g)) return g;
  }
  return null;
}

function toWorkoutExercise(libEx, level, format = "reps") {
  const { sets, reps } = levelSetsReps(level, format);
  return { name: libEx.name, sets, reps, note: libEx.group };
}

function localWorkout(params) {
  const c = exerciseCounts(params.duration, estimateFinisherMinutes(params));

  if (params.theme === "Games") {
    return localGamesWorkout(params, c);
  }

  const focuses = getBlockFocuses(params.theme, c.blocks);
  const used = [];
  const blocks = [];
  let lastPattern = null;
  for (let b = 0; b < c.blocks; b++) {
    const focus = focuses[b];
    const groupOnly = typeof focus === "string" ? focus : focus.group;
    const focusPool = filterLibraryByFocus(focus, params.equipment, used);
    const groupPool = filterLibrary([groupOnly], params.equipment, used);
    const themePool = filterLibrary(THEME_GROUPS[params.theme] || ["Full Body"], params.equipment, used);
    const chosen = pickDiverseFromPools([focusPool, groupPool, themePool], c.perBlock, lastPattern);
    chosen.forEach((e) => used.push(e.name));
    if (chosen.length) lastPattern = detectPattern(chosen[chosen.length - 1].name, chosen[chosen.length - 1].group);
    const blockFormat = blockFormatFor(params.workFormat, b);
    blocks.push({
      name: `Блок ${b + 1}: ${focusLabel(focus)}`,
      exercises: chosen.map((e) => toWorkoutExercise(e, params.level, blockFormat)),
    });
  }
  return {
    title: `${params.theme} · ${params.duration} хв`,
    warmup: shufflePick(WARMUP_POOL, c.warmup),
    blocks,
    cooldown: shufflePick(COOLDOWN_POOL, c.cooldown),
  };
}

// Games theme: Variant A ("Класична") uses a couple of large team-relay
// stations instead of many small focused blocks. Variant B ("Блоки") reuses
// the normal per-focus block structure, just labeled as competitive stations.
function localGamesWorkout(params, c) {
  const groups = THEME_GROUPS["Games"];
  const used = [];
  const level = params.level;
  const repsBase = level === "Просунутий" ? 15 : level === "Початковий" ? 10 : 12;
  const protocol = params.gamesProtocol || "Circuit";
  let blocks = [];
  let protocolInfo = null;

  const pickFormatted = (n, avoidPattern = null) => {
    const p = filterLibrary(groups, params.equipment, used);
    const chosen = pickDiverseFromPools([p], n, avoidPattern);
    chosen.forEach((e) => used.push(e.name));
    return chosen;
  };

  const pickLadderFriendly = (n) => {
    const p = filterLadderFriendly(filterLibrary(groups, params.equipment, used));
    const chosen = pickDiverseFromPools([p.length ? p : filterLibrary(groups, params.equipment, used)], n);
    chosen.forEach((e) => used.push(e.name));
    return chosen;
  };

  if (protocol === "Circuit") {
    const stationCount = Math.min(4, Math.max(2, c.blocks));
    const perStation = Math.max(3, Math.round((c.blocks * c.perBlock) / stationCount));
    const rounds = params.duration <= 30 ? 2 : params.duration >= 50 ? 4 : 3;
    let lastPattern = null;
    for (let s = 0; s < stationCount; s++) {
      const chosen = pickFormatted(perStation, lastPattern);
      if (chosen.length) lastPattern = detectPattern(chosen[chosen.length - 1].name, chosen[chosen.length - 1].group);
      const fmt = blockFormatFor(params.workFormat, s);
      const { reps } = levelSetsReps(level, fmt);
      blocks.push({ name: `Станція ${s + 1}`, exercises: chosen.map((e) => ({ name: e.name, sets: null, reps, note: e.group })) });
    }
    protocolInfo = { label: "Circuit", note: `${rounds} кола по всіх станціях` };
  } else if (protocol === "AMRAP") {
    const cap = Math.max(8, params.duration - 10);
    const n = Math.min(6, Math.max(4, c.blocks * c.perBlock));
    const chosen = pickFormatted(n);
    const fmt = params.workFormat === "time" ? "time" : "reps";
    const { reps } = levelSetsReps(level, fmt);
    blocks = [{ name: "AMRAP-коло", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps, note: e.group })) }];
    protocolInfo = { label: "AMRAP", note: `${cap} хв — максимум повних кіл` };
  } else if (protocol === "EMOM") {
    const mins = Math.max(8, Math.min(20, params.duration - 15));
    const n = Math.min(mins, Math.max(4, c.blocks * c.perBlock));
    const chosen = pickFormatted(n);
    blocks = [{ name: `EMOM ${mins} хв`, exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) }];
    protocolInfo = { label: "EMOM", note: `${mins} хв — щохвилини нова вправа` };
  } else if (protocol === "Ladder") {
    const chosen = pickLadderFriendly(3);
    blocks = [{ name: "Драбина", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "2-4-6-8-10", note: e.group })) }];
    protocolInfo = { label: "Драбина", note: "Кожен раунд — більше повторень" };
  } else if (protocol === "Tabata") {
    const tabataRounds = params.duration <= 30 ? 1 : params.duration >= 50 ? 3 : 2;
    let lastPattern = null;
    for (let t = 0; t < tabataRounds; t++) {
      const chosen = pickFormatted(2, lastPattern);
      if (chosen.length) lastPattern = detectPattern(chosen[chosen.length - 1].name, chosen[chosen.length - 1].group);
      blocks.push({ name: `Табата ${t + 1}`, exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "макс", note: e.group })) });
    }
    protocolInfo = { label: "Табата", note: "20 сек робота / 10 сек відпочинок × 8 раундів" };
  } else if (protocol === "Relay") {
    const stationCount = Math.min(4, Math.max(2, c.blocks));
    const perStation = Math.max(2, Math.round((c.blocks * c.perBlock) / stationCount));
    let lastPattern = null;
    for (let s = 0; s < stationCount; s++) {
      const chosen = pickFormatted(perStation, lastPattern);
      if (chosen.length) lastPattern = detectPattern(chosen[chosen.length - 1].name, chosen[chosen.length - 1].group);
      blocks.push({ name: `Естафета ${s + 1}`, exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) });
    }
    protocolInfo = { label: "Естафетний", note: "Команди по черзі — хто швидше пройде всі етапи" };
  } else if (protocol === "Partner") {
    const roundsCount = params.duration <= 30 ? 1 : params.duration >= 50 ? 3 : 2;
    const perRound = Math.max(3, Math.round((c.blocks * c.perBlock) / roundsCount));
    const fmt = params.workFormat === "time" ? "time" : "reps";
    const { sets, reps } = levelSetsReps(level, fmt);
    let lastPattern = null;
    for (let r = 0; r < roundsCount; r++) {
      const chosen = pickFormatted(perRound, lastPattern);
      if (chosen.length) lastPattern = detectPattern(chosen[chosen.length - 1].name, chosen[chosen.length - 1].group);
      blocks.push({
        name: `Партнерський блок ${r + 1}`,
        instructions: "Партнер А виконує вправу, поки партнер Б тримає планку (чи інше статичне утримання) або відпочиває. По завершенню підходу — міняються ролями.",
        exercises: chosen.map((e) => ({ name: e.name, sets, reps, note: e.group })),
      });
    }
    protocolInfo = { label: "Partner WOD", note: "Один виконує — другий тримає/відпочиває, тоді міняються" };
  } else {
    const chosen = pickLadderFriendly(3);
    blocks = [{ name: "Піраміда", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "2-4-6-8-10-8-6-4-2", note: e.group })) }];
    protocolInfo = { label: "Пірамідальний", note: "Повторення зростають, тоді спадають" };
  }

  return {
    title: `Games · ${GAMES_PROTOCOLS.find((p) => p.key === protocol)?.label || protocol} · ${params.duration} хв`,
    protocol: protocolInfo,
    warmup: shufflePick(WARMUP_POOL, c.warmup),
    blocks,
    cooldown: shufflePick(COOLDOWN_POOL, c.cooldown),
  };
}

function localReplacement(theme, level, equipment, usedNames, blockFocus = null, avoidPatterns = [], format = "reps") {
  const focus = blockFocus || (THEME_GROUPS[theme] || ["Full Body"])[0];
  const groupOnly = typeof focus === "string" ? focus : focus.group;
  const focusPool = filterLibraryByFocus(focus, equipment, usedNames);
  const groupPool = filterLibrary([groupOnly], equipment, usedNames);
  const themePool = filterLibrary(THEME_GROUPS[theme] || ["Full Body"], equipment, usedNames);
  const tiers = [focusPool, groupPool, themePool];

  for (const pool of tiers) {
    const preferred = avoidPatterns.length ? pool.filter((e) => !avoidPatterns.includes(detectPattern(e.name, e.group))) : pool;
    if (preferred.length) {
      const pick = preferred[Math.floor(Math.random() * preferred.length)];
      return toWorkoutExercise(pick, level, format);
    }
  }
  for (const pool of tiers) {
    if (pool.length) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return toWorkoutExercise(pick, level, format);
    }
  }
  return format === "time"
    ? { name: "Планка класична", sets: 3, reps: `${WORK_TIME_SECONDS} сек`, note: "Прес" }
    : { name: "Планка класична", sets: 3, reps: "45 сек", note: "Прес" };
}

const BLOCK_TYPE_GROUP_ALIAS = {
  "Кардіо": ["HIIT"],
  "Силовий": ["Ноги", "Верх", "Сідниці", "Функціональне"],
};

function resolveBlockTypeGroups(blockType) {
  return BLOCK_TYPE_GROUP_ALIAS[blockType] || THEME_GROUPS[blockType] || [blockType];
}

function localBlock(blockType, level, equipment, count, usedNames) {
  const groups = resolveBlockTypeGroups(blockType);
  const available = filterLibrary(groups, equipment, usedNames);
  const chosen = shufflePick(available.length ? available : filterLibrary(groups, equipment), count);
  return { name: `Блок: ${blockType}`, exercises: chosen.map((e) => toWorkoutExercise(e, level)) };
}

// Builds a single Games-protocol block for the standalone block creator
// (unlike the full-workout version, this always returns exactly one block).
function localGamesBlock(protocol, level, equipment, count, usedNames) {
  const groups = THEME_GROUPS["Games"];
  const pool = filterLibrary(groups, equipment, usedNames);
  const ladderPool = filterLadderFriendly(pool);
  const repsBase = level === "Просунутий" ? 15 : level === "Початковий" ? 10 : 12;
  const pick = (n) => pickDiverseFromPools([pool], n);
  const pickLadder = (n) => pickDiverseFromPools([ladderPool.length ? ladderPool : pool], n);

  if (protocol === "AMRAP") {
    const chosen = pick(count);
    return { name: "Games: AMRAP", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) };
  }
  if (protocol === "EMOM") {
    const chosen = pick(count);
    return { name: "Games: EMOM", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) };
  }
  if (protocol === "Ladder") {
    const chosen = pickLadder(Math.min(3, count));
    return { name: "Games: Драбина", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "2-4-6-8-10", note: e.group })) };
  }
  if (protocol === "Tabata") {
    const chosen = pick(2);
    return { name: "Games: Табата", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "макс", note: e.group })) };
  }
  if (protocol === "Pyramid") {
    const chosen = pickLadder(Math.min(3, count));
    return { name: "Games: Піраміда", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: "2-4-6-8-10-8-6-4-2", note: e.group })) };
  }
  if (protocol === "Partner") {
    const chosen = pick(count);
    const { sets, reps } = levelSetsReps(level, "reps");
    return {
      name: "Games: Партнерський блок",
      instructions: "Партнер А виконує вправу, поки партнер Б тримає планку (чи інше статичне утримання) або відпочиває. По завершенню підходу — міняються ролями.",
      exercises: chosen.map((e) => ({ name: e.name, sets, reps, note: e.group })),
    };
  }
  if (protocol === "Relay") {
    const chosen = pick(count);
    return { name: "Games: Естафета", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) };
  }
  // Circuit (default)
  const chosen = pick(count);
  return { name: "Games: Станція (Circuit)", exercises: chosen.map((e) => ({ name: e.name, sets: null, reps: `${repsBase}`, note: e.group })) };
}

function localPlanWeek(themesPool, sessionsPerWeek, weekNum) {
  const days = [];
  for (let d = 1; d <= sessionsPerWeek; d++) {
    const theme = themesPool[(d - 1 + weekNum) % themesPool.length];
    const groups = THEME_GROUPS[theme] || ["Full Body"];
    const sample = shufflePick(EXERCISE_LIBRARY.filter((e) => groups.includes(e.group)), 3).map((e) => e.name);
    days.push({ day: d, theme, focus: `Акцент на ${theme.toLowerCase()}`, blocks: sample });
  }
  return { days };
}

function localFinisher(format, duration, theme, equipment, level) {
  const groups = THEME_GROUPS[theme] || ["Full Body"];
  const pool = filterLibrary(groups, equipment);
  const source = pool.length >= 4 ? pool : EXERCISE_LIBRARY.filter((e) => e.eq.some((x) => equipmentPool(equipment).includes(x)));
  const repsBase = level === "Просунутий" ? 15 : level === "Початковий" ? 10 : 12;

  if (format === "EMOM") {
    const n = Math.min(duration, Math.max(4, source.length));
    const chosen = shufflePick(source, Math.min(n, source.length || 1));
    return {
      name: `Фінішер: EMOM ${duration} хв`,
      format: "EMOM",
      instructions: `Щохвилини — нова вправа, ${repsBase} повторень, залишок хвилини — відпочинок`,
      exercises: chosen.map((e) => ({ name: e.name, reps: `${repsBase}` })),
    };
  }
  if (format === "AMRAP") {
    const chosen = shufflePick(source, 4);
    return {
      name: `Фінішер: AMRAP ${duration} хв`,
      format: "AMRAP",
      instructions: `За ${duration} хв виконати якомога більше повних кіл`,
      exercises: chosen.map((e) => ({ name: e.name, reps: `${repsBase}` })),
    };
  }
  if (format === "Tabata") {
    const chosen = shufflePick(source, 2);
    return {
      name: "Фінішер: Табата",
      format: "Tabata",
      instructions: "20 сек робота / 10 сек відпочинок × 8 раундів, 2 вправи по черзі",
      exercises: chosen.map((e) => ({ name: e.name, reps: "макс" })),
    };
  }
  if (format === "ForTime") {
    const chosen = shufflePick(source, 3);
    const scheme = ["21", "15", "9"];
    return {
      name: "Фінішер: For Time",
      format: "ForTime",
      instructions: "Виконати всі підходи якнайшвидше, зафіксувати час",
      exercises: chosen.map((e, i) => ({ name: e.name, reps: scheme[i] || "12" })),
    };
  }
  // Ladder
  const chosen = shufflePick(source, 3);
  return {
    name: "Фінішер: Драбинка",
    format: "Ladder",
    instructions: "2-4-6-8-10 повторень, з кожним раундом більше",
    exercises: chosen.map((e) => ({ name: e.name, reps: "2-4-6-8-10" })),
  };
}

function detectPattern(name, group) {
  const n = name.toLowerCase();
  if (group === "Pilates") return "stretch";
  if (/присід|випад|степ-ап|зашагування|пістолетик|стінка|сумо|плие/.test(n)) return "squat";
  if (/тяга|хіп-траст|міст|траст|розгинання стегна|кік-бек|донкі/.test(n)) return "hinge";
  if (/жим|віджим/.test(n)) return "push";
  if (/веслування|тяга trx|face pull|обличчя/.test(n)) return "pull";
  if (/планка|скручування|прес|твіст|ножиці|hollow|v-|дровосек|dead bug/.test(n)) return "core";
  if (/стрибок|стрибки|джамп|бурпі|скейтер/.test(n)) return "plyo";
  if (/хода|прогулянка|перенесення|carry|тяга саней/.test(n)) return "carry";
  return "full";
}

// Ladder/Pyramid rep schemes ("2-4-6-8-10") only make sense for simple,
// quickly-countable movements. Excludes distance/time-based cardio (rowing,
// bike, sprints, carries/walks) and multi-movement combos, which can't be
// meaningfully counted "2 reps, then 4, then 6...".
function filterLadderFriendly(pool) {
  return pool.filter((e) => {
    const p = detectPattern(e.name, e.group);
    if (p === "plyo" || p === "carry" || p === "stretch") return false;
    if (/комплекс|хода|спринт|прискорення|гребля|байк|канат|драбинк/i.test(e.name)) return false;
    return true;
  });
}

function localTechnique(ex) {
  const pattern = detectPattern(ex.name, ex.group);
  return PATTERN_TECHNIQUES[pattern] || PATTERN_TECHNIQUES.full;
}

function useTechniqueLookup() {
  const [expandedId, setExpandedId] = useState(null);
  const [cache, setCache] = useState({});

  const toggleExpand = async (id, name, group) => {
    const next = expandedId === id ? null : id;
    setExpandedId(next);
    if (next && !cache[id]) {
      setCache((c) => ({ ...c, [id]: { loading: true } }));
      let result;
      try {
        const prompt = `Коротко поясни техніку виконання вправи "${name}"${group ? ` (група м'язів: ${group})` : ""}.
Формат JSON (без пробілів): {"steps":["крок 1","крок 2","крок 3"],"mistake":"найчастіша помилка коротко"}
Максимум 4 кроки, кожен до 8 слів.`;
        result = await callClaude(SYSTEM_PROMPT, prompt);
      } catch {
        result = localTechnique({ name, group: group || "" });
      }
      setCache((c) => ({ ...c, [id]: { loading: false, ...result } }));
    }
  };

  return { expandedId, cache, toggleExpand };
}

function initFirebase() {

  if (fbAuth) return true;

    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();

// Best-effort background push — never blocks or throws into the caller.
function pushToCloud(key, value) {
  if (!currentUid || !fbDb) return;
  fbDb.collection("users").doc(currentUid).collection("data").doc(key)
    .set({ value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(() => {});
}

async function pullFromCloud(keys) {
  if (!currentUid || !fbDb) return {};
  const result = {};
  for (const key of keys) {
    try {
      const doc = await fbDb.collection("users").doc(currentUid).collection("data").doc(key).get();
      if (doc.exists && doc.data()?.value) result[key] = doc.data().value;
    } catch {}
  }
  return result;
}

/* ------------------------------- storage helper ----------------------------- */
// This build runs as a plain static page (e.g. GitHub Pages), so it uses the
// browser's own localStorage instead of the Claude-artifact window.storage
// API. Function names/signatures are kept identical to the rest of the app
// so no other code had to change. Every successful set also best-effort
// pushes to Firebase (if configured + signed in) for cross-device sync.

async function storageSet(key, value, shared = false) {
  try {
    localStorage.setItem(key, value);
    pushToCloud(key, value);
    return { key, value };
  } catch (err) {
    throw err;
  }
}

async function storageGet(key, shared = false) {
  try {
    const value = localStorage.getItem(key);
    if (value === null) return null;
    return { key, value };
  } catch {
    return null;
  }
}

/* ------------------------------- backup (export/import) --------------------- */

const BACKUP_KEYS = ["saved-workouts", "custom-folders", "custom-workouts", "month-plan"];

async function exportAllData() {
  const data = {};
  for (const key of BACKUP_KEYS) {
    try {
      const res = await storageGet(key, false);
      if (res?.value) data[key] = res.value;
    } catch {}
  }
  const payload = { exportedAt: new Date().toISOString(), version: 1, app: "ai-coach", data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ai-coach-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importAllData(file) {
  const text = await file.text();
  const payload = JSON.parse(text);
  const data = payload?.data || payload;
  let restored = 0;
  for (const key of BACKUP_KEYS) {
    if (data?.[key]) {
      await storageSet(key, data[key], false);
      restored++;
    }
  }
  if (restored === 0) throw new Error("У файлі не знайдено відомих даних застосунку.");
  return restored;
}

function triggerImportPicker(onFile) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) onFile(file);
  };
  input.click();
}

// Attempts to recover a usable object from JSON text that was cut off mid-stream
// (happens when the model hits the output token limit before finishing — more
// likely with Cyrillic text, which costs more tokens per character than Latin).
function tryRepairJSON(raw) {
  const closers = { "{": "}", "[": "]" };
  const cutPoints = [];
  for (let i = raw.length; i > 0; i--) {
    if ("}],".includes(raw[i - 1])) cutPoints.push(i);
  }
  cutPoints.push(raw.length);

  for (const end of cutPoints) {
    const sub = raw.slice(0, end).replace(/,\s*$/, "");
    const stack = [];
    let inStr = false, esc = false, ok = true;
    for (let i = 0; i < sub.length; i++) {
      const ch = sub[i];
      if (esc) { esc = false; continue; }
      if (ch === "\\") { esc = true; continue; }
      if (ch === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (ch === "{" || ch === "[") stack.push(ch);
      else if (ch === "}" || ch === "]") {
        const open = stack.pop();
        if (!open || closers[open] !== ch) { ok = false; break; }
      }
    }
    if (!ok || inStr) continue;
    let candidate = sub;
    for (let i = stack.length - 1; i >= 0; i--) candidate += closers[stack[i]];
    try { return JSON.parse(candidate); } catch { /* try a shorter cut */ }
  }
  return null;
}

async function fetchWithRetry(body, attempts = 3) {
  let lastErr;
  for (let i = 1; i <= attempts; i++) {
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      let data = null;
      try { data = await res.json(); } catch { /* fall through to error below */ }
      if (!res.ok || !data) {
        throw new Error(data?.error?.message || `Тимчасова помилка запиту (${res.status || "мережа"})`);
      }
      return data;
    } catch (err) {
      lastErr = err;
      if (i < attempts) await new Promise((r) => setTimeout(r, 400 * i));
    }
  }
  throw lastErr;
}

async function callClaude(system, user, retry = true) {
  const data = await fetchWithRetry({
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages: [{ role: "user", content: `${system}\n\n${user}` }],
  });
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const clean = text.replace(/```json|```/g, "").trim();
  const start = clean.indexOf("{");
  if (start === -1) {
    if (retry) return callClaude(system, user + "\n\nВАЖЛИВО: дуже коротко, лише JSON.", false);
    throw new Error("AI повернув некоректну відповідь");
  }
  const jsonSlice = clean.slice(start);
  try {
    return JSON.parse(jsonSlice);
  } catch {
    const repaired = tryRepairJSON(jsonSlice);
    if (repaired) return repaired;
    if (retry) return callClaude(system, user + "\n\nВАЖЛИВО: відповідь занадто довга й обривається. Скороти notes, прибери необов'язкові поля, вклади JSON у ліміт.", false);
    throw new Error("Відповідь від AI обірвалась. Спробуй ще раз.");
  }
}

// Estimates how many minutes a chosen finisher will eat into the session,
// so block count can account for it rather than ignoring it.
function estimateFinisherMinutes(params) {
  if (!params?.finisher) return 0;
  if (params.finisher === "EMOM" || params.finisher === "AMRAP") return params.finisherDuration || 10;
  if (params.finisher === "Tabata") return 4;
  return 6; // For Time / Ladder — rough estimate, no fixed duration chosen by user
}

// Blocks are no longer hard-coded to always be 3 — the count (2-5) and
// exercises-per-block are derived from the actual time budget: total
// duration minus warmup, cooldown, and any finisher, divided by a rough
// per-exercise time (work + rest across its sets).
function exerciseCounts(duration, finisherMinutes = 0) {
  const warmup = duration <= 30 ? 2 : 3;
  const cooldown = duration <= 30 ? 2 : 3;
  const perExerciseMin = 4; // rough average incl. rest across ~3 sets
  const mainMinutes = Math.max(8, duration - warmup - cooldown - finisherMinutes);
  const totalExercises = Math.max(4, Math.round(mainMinutes / perExerciseMin));
  let blocks = Math.max(2, Math.min(5, Math.round(totalExercises / 3)));
  const perBlock = Math.max(2, Math.min(4, Math.round(totalExercises / blocks)));
  return { warmup, blocks, perBlock, cooldown };
}

  const sorted = [...folders].sort((a, b) => {
    if (sortMode === "name") return a.name.localeCompare(b.name, "uk");
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  const submit = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    onCreateFolder(trimmed);
    setName("");
    setAdding(false);
  };

  return (
    <div style={{ padding: "8px 20px 40px" }}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <Chip active={sortMode === "name"} onClick={() => setSortMode("name")}>За назвою</Chip>
        <Chip active={sortMode === "date"} onClick={() => setSortMode("date")}>За датою</Chip>
      </div>

      {sorted.length === 0 && !adding && (
        <div style={{ textAlign: "center", padding: "30px 0", fontFamily: "'Inter',sans-serif", fontSize: 13, color: "#8D949B" }}>
          Ще немає жодної папки — створи першу, наприклад «Full Body».
        </div>
      )}

      {sorted.map((f) => (
        <button
          key={f.id}
          onClick={() => onOpenFolder(f)}
          style={{ display: "flex", alignItems: "center", gap: 12, width: "100%", background: "#0B1118", border: "1px solid #12191F", borderRadius: 14, padding: "13px 14px", marginBottom: 10, textAlign: "left" }}
        >
          <div style={{ width: 38, height: 38, borderRadius: 10, background: "#34E4EA22", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
            <Folder size={18} color="#34E4EA" />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "'Inter',sans-serif", fontWeight: 700, fontSize: 14, color: "#F3F4F1" }}>{f.name}</div>
            <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 11, color: "#8D949B", marginTop: 2 }}>
              {workoutCounts[f.id] || 0} тренувань

          </div>
          <ChevronRight size={16} color="#5C6268" />
        </button>
      ))}

      {adding ? (
        <div style={{ display: "flex", gap: 8 }}>
          <input
            autoFocus
            value={name}
            onChange={(e) => setName(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            placeholder="Назва папки…"
            style={{ flex: 1, background: "#0B1118", border: "1px solid #1B2530", borderRadius: 12, padding: "12px 14px", color: "#F3F4F1", fontFamily: "'Inter',sans-serif", fontSize: 14 }}
          />
          <button onClick={submit} style={{ background: "#34E4EA", borderRadius: 12, padding: "0 18px", fontWeight: 700, color: "#04181A" }}>OK</button>
        </div>
      ) : (
        <button
          onClick={() => setAdding(true)}
          style={{ width: "100%", background: "#0B1118", border: "1px solid #34E4EA", borderRadius: 14, padding: 14, textAlign: "center", color: "#34E4EA", fontFamily: "'Inter',sans-serif", fontWeight: 700, fontSize: 13 }}
        >
          + Нова папка
        </button>
      )}
    </div>
  );
}

function newExercise() {
  return { name: "", valueType: "reps", value: "", sets: "3" };
}
function newBlock(index) {
  return { name: `Блок ${index + 1}: `, format: "sets", rounds: 3, exercises: [newExercise()] };
}
function newCustomDraft(folderId) {
  return { id: null, folderId, title: "", mode: "structured", freeformText: "", blocks: [newBlock(0)] };
}

function CustomWorkoutForm({ draft, setDraft, folders, onSave, onCancel }) {
  const updateBlock = (bi, patch) => {
    setDraft((d) => {
      const blocks = [...d.blocks];
      blocks[bi] = { ...blocks[bi], ...patch };
      return { ...d, blocks };
    });
  };
  const updateExercise = (bi, ei, patch) => {
    setDraft((d) => {
      const blocks = d.blocks.map((b, i) => {
        if (i !== bi) return b;
        const exercises = b.exercises.map((ex, j) => (j === ei ? { ...ex, ...patch } : ex));
        return { ...b, exercises };
      });
      return { ...d, blocks };
    });
  };
  const addExercise = (bi) => setDraft((d) => {
    const blocks = d.blocks.map((b, i) => (i === bi ? { ...b, exercises: [...b.exercises, newExercise()] } : b));
    return { ...d, blocks };
  });
  const removeExercise = (bi, ei) => setDraft((d) => {
    const blocks = d.blocks.map((b, i) => (i === bi ? { ...b, exercises: b.exercises.filter((_, j) => j !== ei) } : b));
    return { ...d, blocks };
  });
  const addBlock = () => setDraft((d) => ({ ...d, blocks: [...d.blocks, newBlock(d.blocks.length)] }));
  const removeBlock = (bi) => setDraft((d) => ({ ...d, blocks: d.blocks.filter((_, i) => i !== bi) }));

  return (
    <div style={{ padding: "8px 20px 40px" }}>
      <SectionLabel icon={Pencil}>Назва тренування</SectionLabel>
      <input
        value={draft.title}
        onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))}
        placeholder="Наприклад: Клубна версія №2"
        style={{ width: "100%", background: "#0B1118", border: "1px solid #1B2530", borderRadius: 12, padding: "12px 14px", color: "#F3F4F1", fontFamily: "'Inter',sans-serif", fontSize: 14 }}
      />

      <SectionLabel icon={Folder}>Папка</SectionLabel>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
        {folders.map((f) => (
          <Chip key={f.id} active={draft.folderId === f.id} onClick={() => setDraft((d) => ({ ...d, folderId: f.id }))}>{f.name}</Chip>
        ))}
      </div>

      {draft.mode === "freeform" ? (
        <>
          <SectionLabel icon={Pencil}>Нотатки / вправи (довільний текст)</SectionLabel>
          <textarea
            rows={10}
            value={draft.freeformText}
            onChange={(e) => setDraft((d) => ({ ...d, freeformText: e.target.value }))}
            placeholder={"Пиши як завгодно, наприклад:\nБлок 1: Присід 3x12, Випади 3x12\nФінішер: AMRAP 8 хв — бурпі, планка"}
            style={{ width: "100%", background: "#0B1118", border: "1px solid #1B2530", borderRadius: 12, padding: "12px 14px", color: "#F3F4F1", fontFamily: "'Inter',sans-serif", fontSize: 13, resize: "vertical" }}
          />
        </>
      ) : (
        <>
          <SectionLabel icon={Layers}>Блоки вправ</SectionLabel>
          {draft.blocks.map((block, bi) => (
            <div key={bi} style={{ background: "#0B1118", border: "1px solid #12191F", borderRadius: 14, padding: 12, marginBottom: 12 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 18, color: "#34E4EA" }}>{String(bi + 1).padStart(2, "0")}</span>
                <input
                  value={block.name}
                  onChange={(e) => updateBlock(bi, { name: e.target.value })}
                  placeholder="Блок N: своя назва…"
                  style={{ flex: 1, background: "#12191F", border: "1px solid #333", borderRadius: 8, padding: "7px 10px", color: "#F3F4F1", fontWeight: 700, fontSize: 13, fontFamily: "'Inter',sans-serif", minWidth: 0 }}
                />
                {draft.blocks.length > 1 && (
                  <button onClick={() => removeBlock(bi)} style={{ color: "#5C6268", flexShrink: 0 }}>✕</button>
                )}
              </div>

              <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
                <Chip active={block.format === "sets"} onClick={() => updateBlock(bi, { format: "sets" })}>Підходи на вправу</Chip>
                <Chip active={block.format === "rounds"} onClick={() => updateBlock(bi, { format: "rounds" })}>Кола</Chip>
              </div>

              {block.format === "rounds" && (
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                  <span style={{ fontFamily: "'Inter',sans-serif", fontSize: 11, color: "#8D949B", fontWeight: 700, textTransform: "uppercase" }}>Кількість кіл</span>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, background: "#12191F", borderRadius: 8, padding: "3px 6px" }}>
                    <button onClick={() => updateBlock(bi, { rounds: Math.max(2, (block.rounds || 3) - 1) })} style={{ width: 22, height: 22, background: "#333", borderRadius: 6, color: "#F3F4F1" }}>−</button>
                    <span style={{ fontFamily: "'JetBrains Mono',monospace", color: "#34E4EA", fontSize: 13, minWidth: 14, textAlign: "center" }}>{block.rounds || 3}</span>
                    <button onClick={() => updateBlock(bi, { rounds: (block.rounds || 3) + 1 })} style={{ width: 22, height: 22, background: "#333", borderRadius: 6, color: "#F3F4F1" }}>+</button>
                  </div>
                </div>
              )}

              {block.exercises.map((ex, ei) => (
                <div key={ei} style={{ marginBottom: 8 }}>
                  <div style={{ display: "grid", gridTemplateColumns: block.format === "sets" ? "1fr 44px 56px 20px" : "1fr 56px 20px", gap: 6, marginBottom: 5 }}>
                    <input
                      value={ex.name}
                      onChange={(e) => updateExercise(bi, ei, { name: e.target.value })}
                      placeholder="Назва вправи…"
                      style={{ background: "#0B1118", border: "1px solid #1B2530", borderRadius: 8, padding: "7px 8px", color: "#F3F4F1", fontSize: 12, fontFamily: "'Inter',sans-serif", minWidth: 0 }}
                    />
                    {block.format === "sets" && (
                      <input
                        value={ex.sets}
                        onChange={(e) => updateExercise(bi, ei, { sets: e.target.value })}
                        placeholder="3"
                        style={{ background: "#0B1118", border: "1px solid #1B2530", borderRadius: 8, padding: "7px 6px", color: "#F3F4F1", fontSize: 12, textAlign: "center", fontFamily: "'JetBrains Mono',monospace" }}
                      />
                    )}
                    <input
                      value={ex.value}
                      onChange={(e) => updateExercise(bi, ei, { value: e.target.value })}
                      placeholder={ex.valueType === "time" ? "40 сек" : "12-15"}
                      style={{ background: "#0B1118", border: "1px solid #1B2530", borderRadius: 8, padding: "7px 6px", color: "#F3F4F1", fontSize: 12, textAlign: "center", fontFamily: "'JetBrains Mono',monospace" }}
                    />
                    <button onClick={() => removeExercise(bi, ei)} style={{ color: "#5C6268", fontSize: 13 }}>✕</button>
                  </div>
                  <div style={{ display: "flex", width: 130, border: "1px solid #1B2530", borderRadius: 6, overflow: "hidden" }}>
                    <button
                      onClick={() => updateExercise(bi, ei, { valueType: "reps" })}
                      style={{ flex: 1, padding: "5px 2px", fontSize: 9, fontWeight: 700, background: ex.valueType === "reps" ? "#7DC7CA" : "transparent", color: ex.valueType === "reps" ? "#0c0e10" : "#8D949B" }}
                    >
                      # повт.
                    </button>
                    <button
                      onClick={() => updateExercise(bi, ei, { valueType: "time" })}
                      style={{ flex: 1, padding: "5px 2px", fontSize: 9, fontWeight: 700, background: ex.valueType === "time" ? "#7DC7CA" : "transparent", color: ex.valueType === "time" ? "#0c0e10" : "#8D949B" }}
                    >
                      ⏱ час
                    </button>
                  </div>
                </div>
              ))}
              <button onClick={() => addExercise(bi)} style={{ width: "100%", fontSize: 12, color: "#8D949B", background: "#0B1118", border: "1px dashed #26313B", borderRadius: 8, padding: 7 }}>
                + {block.format === "rounds" ? "Вправа в коло" : "Вправа"}
              </button>
            </div>
          ))}
          <button onClick={addBlock} style={{ width: "100%", fontSize: 13, fontWeight: 700, color: "#34E4EA", background: "#0B1118", border: "1px dashed #26313B80", borderRadius: 12, padding: 12, marginBottom: 12 }}>
            + Додати блок
          </button>
        </>
      )}

      <div style={{ marginTop: 16 }}>
        <BigButton onClick={onSave}><Save size={16} /> Зберегти</BigButton>
        <div style={{ marginTop: 8 }}>
          <BigButton variant="ghost" onClick={() => setDraft((d) => ({ ...d, mode: d.mode === "freeform" ? "structured" : "freeform" }))}>
            {draft.mode === "freeform" ? "Перемкнути на структуровані блоки" : "Перемкнути на вільний текст"}
          </BigButton>
        </div>
      </div>
    </div>
  );
}

function LibraryTab() {
  const [search, setSearch] = useState("");
  const [groupFilter, setGroupFilter] = useState([]);
  const [eqFilter, setEqFilter] = useState([]);
  const { expandedId, cache: techniqueCache, toggleExpand: toggleExpandRaw } = useTechniqueLookup();
  const toggleExpand = (ex) => toggleExpandRaw(ex.id, ex.name, ex.group);

  const toggle = (arr, setArr, val) => setArr(arr.includes(val) ? arr.filter((x) => x !== val) : [...arr, val]);

  const filtered = EXERCISE_LIBRARY.filter((ex) => {
    const matchSearch = ex.name.toLowerCase().includes(search.toLowerCase());
    const matchGroup = groupFilter.length === 0 || groupFilter.includes(ex.group);
    const matchEq = eqFilter.length === 0 || ex.eq.some((e) => eqFilter.includes(e));
    return matchSearch && matchGroup && matchEq;
  });

  return (
    <div style={{ padding: "20px 20px 40px" }}>
      <h1 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 30, color: "#F3F4F1", margin: "0 0 16px" }}>Бібліотека вправ</h1>

        <input
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Пошук вправи…"
          style={{ background: "none", border: "none", outline: "none", color: "#F3F4F1", fontFamily: "'Inter',sans-serif", fontSize: 14, width: "100%" }}
        />
      </div>

      <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: 1, color: "#8D949B", textTransform: "uppercase", marginBottom: 8 }}>М'язова група</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
        {MUSCLE_GROUPS.map((g) => {
          const v = groupVisual(g);
          return (
            <button
              key={g}

              style={{
                display: "flex", alignItems: "center", gap: 6,
                fontFamily: "'Inter',sans-serif", borderRadius: 999, padding: "8px 14px", fontSize: 13, fontWeight: 600,
                border: groupFilter.includes(g) ? "1px solid #34E4EA" : "1px solid #1B2530",
                background: groupFilter.includes(g) ? "#34E4EA" : "#0B1118",
                color: groupFilter.includes(g) ? "#04181A" : "#C7CCD1",
              }}
            >
              <v.icon size={14} color={groupFilter.includes(g) ? "#04181A" : v.color} />
              {g}
            </button>
          );
        })}
      </div>

      <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: 1, color: "#8D949B", textTransform: "uppercase", marginBottom: 8 }}>Обладнання</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
        {EQUIPMENT_OPTIONS.map((e) => (
          <Chip key={e} active={eqFilter.includes(e)} onClick={() => toggle(eqFilter, setEqFilter, e)}>{e}</Chip>
        ))}
      </div>

      <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 12, color: "#5C6268", marginBottom: 8 }}>{filtered.length} вправ · тапни для техніки виконання</div>
      {filtered.map((ex) => {
        const v = groupVisual(ex.group);
        const isOpen = expandedId === ex.id;
        const tech = techniqueCache[ex.id];
        return (
          <div key={ex.id} style={{ borderBottom: "1px solid #12191F" }}>
            <button onClick={() => toggleExpand(ex)} style={{ display: "flex", gap: 12, padding: "12px 0", width: "100%", background: "none", border: "none", textAlign: "left" }}>
              <div style={{
                width: 56, height: 56, borderRadius: 14, flexShrink: 0,
                background: `linear-gradient(155deg, ${v.color}26, ${v.color}0A)`,
                border: `1px solid ${v.color}55`,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <PoseIllustration group={ex.group} color={v.color} size={38} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: "'Inter',sans-serif", fontWeight: 600, fontSize: 14, color: "#F3F4F1" }}>{ex.name}</div>
                <div style={{ display: "flex", gap: 6, marginTop: 5, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: v.color, background: "#12191F", padding: "2px 8px", borderRadius: 6 }}>{ex.group}</span>
                  {ex.eq.map((e) => (
                    <span key={e} style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, color: "#7DC7CA", background: "#12191F", padding: "2px 8px", borderRadius: 6 }}>{e}</span>
                  ))}
                </div>
              </div>
              <ChevronRight size={16} color="#5C6268" style={{ flexShrink: 0, alignSelf: "center", transform: isOpen ? "rotate(90deg)" : "none" }} />
            </button>

            {isOpen && (
              <div style={{ padding: "0 0 16px 68px" }}>
                <TechniqueDetail tech={tech} exerciseName={ex.name} />
              </div>
            )}
          </div>
        );
      })}
      {filtered.length === 0 && (
        <div style={{ fontFamily: "'Inter',sans-serif", fontSize: 13, color: "#5C6268", textAlign: "center", marginTop: 30 }}>
          Нічого не знайдено — спробуй інші фільтри.
        </div>
      )}
    </div>
  );
}

      setCloudBusy(false);

      setCloudMessage({ type: "error", text: e.message || "Не вдалось зареєструватися." });

  const generateWorkout = useCallback(async () => {
    setLoading(true); setError(null); setSavedFlag(false);
    try {
      const c = exerciseCounts(params.duration, estimateFinisherMinutes(params));
      const eqStr = params.equipment.length ? params.equipment.join(", ") : "без інвентаря";
      const isGames = params.theme === "Games";

      const focusLines = isGames ? "" : focuses.map((f, i) => `Блок ${i + 1}: акцент — ${focusLabel(f)}`).join("\n");
      const workFormatLine = params.workFormat === "time"
        ? `Формат роботи: НА ЧАС. Усі вправи у всіх блоках — ${WORK_TIME_SECONDS} сек роботи замість кількості повторень (поле "reps" має містити "${WORK_TIME_SECONDS} сек").`
        : params.workFormat === "mixed"
        ? `Формат роботи: ЗМІШАНИЙ. Блоки чергуються: непарні блоки (1, 3, 5…) — на повторення (звичайний діапазон типу "12-15"), парні блоки (2, 4, 6…) — на час, усі вправи по ${WORK_TIME_SECONDS} сек (поле "reps" = "${WORK_TIME_SECONDS} сек"). Усередині одного блоку формат не змішувати.`
        : `Формат роботи: на повторення (звичайний діапазон типу "12-15").`;
      const protocolMeta = GAMES_PROTOCOLS.find((p) => p.key === params.gamesProtocol);
      const gamesLine = !isGames ? "" : (() => {
        const proto = params.gamesProtocol;
        const totalEx = c.blocks * c.perBlock;
        const partnerRounds = params.duration <= 30 ? 1 : params.duration >= 50 ? 3 : 2;
        if (proto === "Circuit") return `Тема Games, протокол Circuit (${protocolMeta.desc}): зроби 2-4 станції ("Станція N"), кожна з кількома вправами. Додай у "title" згадку про кількість кіл (2-4 залежно від тривалості), які потрібно пройти по всіх станціях підряд.`;
        if (proto === "AMRAP") return `Тема Games, протокол AMRAP (${protocolMeta.desc}): ОДИН блок "AMRAP-коло" з ${Math.min(6, Math.max(4, totalEx))} вправами без сталої кількості підходів (поле "sets" не потрібне або null) — команда виконує коло за колом, поки не мине ліміт часу.`;
        if (proto === "EMOM") return `Тема Games, протокол EMOM (${protocolMeta.desc}): ОДИН блок "EMOM N хв" з вправами, що виконуються по одній щохвилини по черзі (без "sets").`;
        if (proto === "Ladder") return `Тема Games, протокол Драбина (${protocolMeta.desc}): ОДИН блок "Драбина" з 2-3 вправами, для кожної "reps" = "2-4-6-8-10" (без "sets"). Обирай ЛИШЕ прості вправи на підрахунок повторень (присід, віджимання, випад, скручування) — НЕ вправи на дистанцію/час/складні комплекси (без бігу, спринтів, човгання, гребного тренажера, комплексів типу "гребля-присід-жим").`;
        if (proto === "Tabata") return `Тема Games, протокол Табата (${protocolMeta.desc}): 1-3 блоки "Табата N", кожен з 2 вправами, для кожної "reps" = "макс" (без "sets").`;
        if (proto === "Relay") return `Тема Games, протокол Естафетний (${protocolMeta.desc}): 2-4 блоки "Естафета N" — команди по черзі проходять кожну станцію наввипередки, опиши елемент змагання в назвах.`;
        if (proto === "Partner") return `Тема Games, протокол Partner WOD (${protocolMeta.desc}): зроби ${partnerRounds} блок(и) "Партнерський блок N" (кількість залежить від тривалості — не завжди один блок на всю сесію). У кожному блоці заповни поле "instructions" явним поясненням ролі другого партнера, наприклад: "Партнер А виконує вправу, партнер Б у цей час тримає планку/статичну позу або відпочиває — по завершенню підходу міняються ролями." Вкажи це чітко, а не залишай без пояснення.`;
        return `Тема Games, протокол Пірамідальний (${protocolMeta.desc}): ОДИН блок "Піраміда" з 2-3 вправами, для кожної "reps" = "2-4-6-8-10-8-6-4-2" (без "sets"). Обирай ЛИШЕ прості вправи на підрахунок повторень — НЕ вправи на дистанцію/час/складні комплекси.`;
      })();
      const userPrompt = `Склади групове тренування.
Тривалість: ${params.duration} хв
Кількість людей: ${params.people}
Обладнання: ${eqStr}
Рівень групи: ${params.level}
Тема: ${params.theme}
${workFormatLine}
${gamesLine}

${isGames ? "" : `Орієнтовний акцент по блоках (можна відхилятись, це не жорстка вимога):\n${focusLines}\n`}Розминка — ${c.warmup} вправи, заминка — ${c.cooldown} вправи.
ВАЖЛИВО: ніколи не став поруч (в межах одного блоку чи на стику блоків) дві вправи одного типу руху — наприклад два присіди, два жими лежачи, дві планки поспіль. Чергуй типи рухів (присід / тазостегновий нахил / жим / тяга / кор / вибухові) для різноманітності. Якщо в межах акценту блоку бракує різних типів рухів — краще взяти вправу із суміжної м'язової групи цієї ж теми, ніж повторити той самий тип руху.
${isGames ? "" : 'Назви блоків формату "Блок N: <акцент як вказано вище>".\n'}Поле "instructions" в блоці необов'язкове — заповнюй його лише коли формат потребує пояснення механіки (наприклад Partner WOD, Relay), інакше не додавай.
Формат JSON (без пробілів, лише ці поля):
{"title":"...","warmup":[{"name":"...","dur":"60 сек"}],"blocks":[{"name":"Блок 1: ...","instructions":"(опційно)","exercises":[{"name":"...","sets":3,"reps":"12-15","note":"..."}]}],"cooldown":[{"name":"...","dur":"60 сек"}]}`;
      let result, fallback = false;
      try {
        result = await callClaude(SYSTEM_PROMPT, userPrompt);
      } catch {
        result = localWorkout(params);
        fallback = true;
      }

      if (params.finisher) {
        const fmtInfo = FINISHER_FORMATS.find((f) => f.key === params.finisher);
        const finisherPrompt = `Додай фінішер (короткий завершальний блок високої інтенсивності) до тренування на тему "${params.theme}".
Формат: ${fmtInfo.label} (${fmtInfo.desc})
${(params.finisher === "EMOM" || params.finisher === "AMRAP") ? `Тривалість: ${params.finisherDuration} хв` : ""}
Обладнання: ${eqStr}
Рівень: ${params.level}
Формат JSON (без пробілів): {"name":"Фінішер: ${fmtInfo.label}","format":"${params.finisher}","instructions":"коротко до 10 слів","exercises":[{"name":"...","reps":"..."}]}
Кількість вправ: 2-4 залежно від формату.`;
        try {
          result.finisher = fallback ? localFinisher(params.finisher, params.finisherDuration, params.theme, params.equipment, params.level) : await callClaude(SYSTEM_PROMPT, finisherPrompt);
        } catch {
          result.finisher = localFinisher(params.finisher, params.finisherDuration, params.theme, params.equipment, params.level);
        }
      }

      setWorkout(result);
      setUsedFallback(fallback);
      setView("workoutResult");
    } catch (e) {
      setError(e.message || "Не вдалось згенерувати тренування. Спробуй ще раз.");
    } finally {
      setLoading(false);
    }
  }, [params]);

  const replaceExercise = useCallback(async (bi, ei) => {
    if (!workout) return;
    const key = `${bi}-${ei}`;
    setReplacingKey(key);
    try {
      const block = workout.blocks[bi];
      const oldEx = block.exercises[ei];
      const scheme = specialRepsScheme(oldEx.reps);
      const usedNames = [
        ...workout.warmup.map((w) => w.name),
        ...workout.blocks.flatMap((b) => b.exercises.map((e) => e.name)),
        ...workout.cooldown.map((w) => w.name),
      ];
      const blockFocus = inferBlockFocus(block.name, params.theme);
      const focusText = blockFocus ? focusLabel(blockFocus) : params.theme;
      const blockFormat = inferBlockValueFormat(block, params.workFormat === "time" ? "time" : "reps");
      const neighborPatterns = [];
      if (ei > 0) neighborPatterns.push(detectPattern(block.exercises[ei - 1].name, block.exercises[ei - 1].note || ""));
      if (ei < block.exercises.length - 1) neighborPatterns.push(detectPattern(block.exercises[ei + 1].name, block.exercises[ei + 1].note || ""));
      const neighborPatternLabels = [...new Set(neighborPatterns)].map((p) => PATTERN_LABELS_UK[p] || p);
      const eqStr = params.equipment.length ? params.equipment.join(", ") : "без інвентаря";
      const userPrompt = `Тема тренування: "${params.theme}", рівень: ${params.level}, обладнання: ${eqStr}.
Заміни вправу "${oldEx.name}" у блоці "${block.name}".
Бажано (не обов'язково) тримати той самий загальний фокус блоку: ${focusText}.
${scheme ? `ВАЖЛИВО: цей блок має спеціальну схему повторень "${scheme}" — заповни "reps" ТОЧНО цим значенням (не заповнюй "sets"), і обери просту вправу на підрахунок повторень (присід/віджимання/випад/скручування) — НЕ вправу на дистанцію, час чи складний комплекс (без бігу, спринтів, човгання, комплексів типу "гребля-присід-жим").` : `Формат цього блоку — ${blockFormat === "time" ? `НА ЧАС: поле "reps" має бути "${WORK_TIME_SECONDS} сек"` : "на повторення: поле \"reps\" — діапазон типу \"12-15\""}.`}
${neighborPatternLabels.length ? `ВАЖЛИВО: сусідні вправи в цьому блоці вже мають тип руху "${neighborPatternLabels.join(', ')}" — нова вправа НЕ повинна бути того ж типу (щоб не було двох однакових рухів поспіль, наприклад двох присідів).` : ""}
Вже використані вправи, не повторювати: ${usedNames.join(", ")}
Поверни ОДНУ вправу у форматі JSON (без пробілів): {"name":"...","sets":3,"reps":"12-15","note":"..."}`;
      let newEx;
      try {
        newEx = await callClaude(SYSTEM_PROMPT, userPrompt);
      } catch {
        if (scheme) {
          const groups = THEME_GROUPS[params.theme] || ["Full Body"];
          const pool = filterLadderFriendly(filterLibrary(groups, params.equipment, usedNames));
          const pick = pool[Math.floor(Math.random() * Math.max(1, pool.length))];
          newEx = pick ? { name: pick.name, sets: null, reps: scheme, note: pick.group } : { ...oldEx };
        } else {
          newEx = localReplacement(params.theme, params.level, params.equipment, usedNames, blockFocus, neighborPatterns, blockFormat);
        }
      }
      if (scheme) {
        newEx = { ...newEx, reps: scheme, sets: null };
      }
      setWorkout((w) => {
        const copy = structuredClone(w);
        copy.blocks[bi].exercises[ei] = newEx;
        return copy;
      });
    } catch (e) {
      setError("Не вдалось замінити вправу.");
    } finally {
      setReplacingKey(null);

      const fmtInfo = FINISHER_FORMATS.find((f) => f.key === params.finisher);
      const eqStr = params.equipment.length ? params.equipment.join(", ") : "без інвентаря";
      const finisherPrompt = `Додай фінішер (короткий завершальний блок високої інтенсивності) до тренування на тему "${params.theme}".
Формат: ${fmtInfo.label} (${fmtInfo.desc})
${(params.finisher === "EMOM" || params.finisher === "AMRAP") ? `Тривалість: ${params.finisherDuration} хв` : ""}
Обладнання: ${eqStr}
Рівень: ${params.level}
Формат JSON (без пробілів): {"name":"Фінішер: ${fmtInfo.label}","format":"${params.finisher}","instructions":"коротко до 10 слів","exercises":[{"name":"...","reps":"..."}]}
Кількість вправ: 2-4 залежно від формату.`;
      let newFinisher;
      try {
        newFinisher = await callClaude(SYSTEM_PROMPT, finisherPrompt);

        newFinisher = localFinisher(params.finisher, params.finisherDuration, params.theme, params.equipment, params.level);

      setWorkout((w) => ({ ...w, finisher: newFinisher }));

      setFinisherLoading(false);
