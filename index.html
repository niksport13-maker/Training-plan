  const regenerateBlock = useCallback(async (bi) => {
    if (!workout) return;
    setBlockLoadingIndex(bi);
    try {
      const block = workout.blocks[bi];
      const count = block.exercises.length;
      const blockFocus = inferBlockFocus(block.name, params.theme);
      const focusText = blockFocus ? focusLabel(blockFocus) : params.theme;
      const blockFormat = inferBlockValueFormat(block, params.workFormat === "time" ? "time" : "reps");
      const scheme = specialRepsScheme(block.exercises[0]?.reps);
      const usedNames = [
        ...workout.warmup.map((w) => w.name),
        ...workout.blocks.flatMap((b, i) => (i === bi ? [] : b.exercises.map((e) => e.name))),
        ...workout.cooldown.map((w) => w.name),
      ];
      const eqStr = params.equipment.length ? params.equipment.join(", ") : "без інвентаря";
      const userPrompt = `Тема тренування: "${params.theme}", рівень: ${params.level}, обладнання: ${eqStr}.
Повністю онови блок "${block.name}" (замінити всі ${count} вправи), зберігаючи фокус: ${focusText}.
${scheme ? `ВАЖЛИВО: цей блок має спеціальну схему повторень "${scheme}" — заповни "reps" ТОЧНО цим значенням для КОЖНОЇ вправи (не заповнюй "sets"), і обирай лише прості вправи на підрахунок повторень (присід/віджимання/випад/скручування) — НЕ вправи на дистанцію, час чи складні комплекси.` : `Формат — ${blockFormat === "time" ? `НА ЧАС: поле "reps" = "${WORK_TIME_SECONDS} сек" для кожної вправи` : "на повторення: поле \"reps\" — діапазон типу \"12-15\""}.`}
ВАЖЛИВО: не став поруч дві вправи одного типу руху (наприклад два присіди) — чергуй типи рухів.
Вже використані в інших блоках вправи, не повторювати: ${usedNames.join(", ")}
Формат JSON (без пробілів): {"exercises":[{"name":"...","sets":3,"reps":"12-15","note":"..."}]}
Кількість вправ: ${count}.`;
      let newExercises;
      try {
        const result = await callClaude(SYSTEM_PROMPT, userPrompt);
        newExercises = result.exercises;
      } catch {
        if (scheme) {
          const themeGroups = THEME_GROUPS[params.theme] || ["Full Body"];
          const ladderPool = filterLadderFriendly(filterLibrary(themeGroups, params.equipment, usedNames));
          const chosen = pickDiverseFromPools([ladderPool.length ? ladderPool : filterLibrary(themeGroups, params.equipment, usedNames)], count, null);
          newExercises = chosen.map((e) => ({ name: e.name, sets: null, reps: scheme, note: e.group }));
        } else {
          const groupOnly = typeof blockFocus === "string" ? blockFocus : blockFocus?.group;
          const focusPool = blockFocus ? filterLibraryByFocus(blockFocus, params.equipment, usedNames) : [];
          const groupPool = groupOnly ? filterLibrary([groupOnly], params.equipment, usedNames) : [];
          const themePool = filterLibrary(THEME_GROUPS[params.theme] || ["Full Body"], params.equipment, usedNames);
          const chosen = pickDiverseFromPools([focusPool, groupPool, themePool], count, null);
          newExercises = chosen.map((e) => toWorkoutExercise(e, params.level, blockFormat));
        }
      }
      if (scheme) {
        newExercises = newExercises.map((e) => ({ ...e, reps: scheme, sets: null }));
      }
      setWorkout((w) => {
        const copy = structuredClone(w);
        copy.blocks[bi].exercises = newExercises;
        return copy;
      });
    } catch (e) {
      setError("Не вдалось оновити блок.");
    } finally {
      setBlockLoadingIndex(null);
    }
  }, [workout, params]);

  const generateBlock = useCallback(async () => {
    setBlockLoading(true); setBlockError(null);
    try {
      const count = blockParams.blockDuration <= 8 ? 3 : blockParams.blockDuration <= 12 ? 4 : blockParams.blockDuration <= 16 ? 5 : 6;
      const eqStr = blockParams.equipment.length ? blockParams.equipment.join(", ") : "без інвентаря";
      const usedNames = workout ? workout.blocks.flatMap((b) => b.exercises.map((e) => e.name)) : [];
      const isGames = blockParams.blockType === "Games";
      const protocolMeta = GAMES_PROTOCOLS.find((p) => p.key === blockParams.gamesProtocol);
      const userPrompt = isGames
        ? `Створи ОДИН блок вправ у форматі Games, протокол ${protocolMeta.label} (${protocolMeta.desc}).
Кількість людей: ${blockParams.people}
Обладнання: ${eqStr}
Рівень: ${blockParams.level}
Кількість вправ: ${count}
${blockParams.gamesProtocol === "AMRAP" || blockParams.gamesProtocol === "EMOM" ? 'Без сталої кількості підходів (поле "sets" не потрібне або null).' : ""}
${blockParams.gamesProtocol === "Ladder" ? 'Для кожної вправи "reps" = "2-4-6-8-10" (без "sets"). Обирай ЛИШЕ прості вправи на підрахунок повторень (присід, віджимання, випад, скручування) — НЕ вправи на дистанцію/час/складні комплекси.' : ""}
${blockParams.gamesProtocol === "Pyramid" ? 'Для кожної вправи "reps" = "2-4-6-8-10-8-6-4-2" (без "sets"). Обирай ЛИШЕ прості вправи на підрахунок повторень — НЕ вправи на дистанцію/час/складні комплекси.' : ""}
${blockParams.gamesProtocol === "Tabata" ? 'Лише 2 вправи, "reps" = "макс" (без "sets").' : ""}
${usedNames.length ? `Не повторювати вправи: ${usedNames.join(", ")}` : ""}
Формат JSON (без пробілів): {"name":"Games: ${protocolMeta.label}","exercises":[{"name":"...","sets":3,"reps":"12-15","note":"..."}]}`
        : `Створи блок вправ.
Тип блоку: ${blockParams.blockType}
Тривалість: ${blockParams.blockDuration} хв
Кількість людей: ${blockParams.people}
Обладнання: ${eqStr}
Рівень: ${blockParams.level}
Кількість вправ: ${count}
${usedNames.length ? `Не повторювати вправи: ${usedNames.join(", ")}` : ""}
Формат JSON (без пробілів): {"name":"Блок: ${blockParams.blockType}","exercises":[{"name":"...","sets":3,"reps":"12-15","note":"..."}]}`;
      let result;
      try {
        result = await callClaude(SYSTEM_PROMPT, userPrompt);
      } catch {
        result = isGames
          ? localGamesBlock(blockParams.gamesProtocol, blockParams.level, blockParams.equipment, count, usedNames)
          : localBlock(blockParams.blockType, blockParams.level, blockParams.equipment, count, usedNames);
      }
      setBlock(result);
      setView("blockResult");
    } catch (e) {
      setBlockError(e.message || "Не вдалось згенерувати блок.");
    } finally {
      setBlockLoading(false);
    }
  }, [blockParams, workout]);

  const replaceBlockExercise = useCallback(async (ei) => {
    if (!block) return;
    setBlockReplacingIndex(ei);
    try {
      const oldEx = block.exercises[ei];
      const scheme = specialRepsScheme(oldEx.reps);
      const usedNames = block.exercises.map((e) => e.name);
      const neighborPatterns = [];
      if (ei > 0) neighborPatterns.push(detectPattern(block.exercises[ei - 1].name, block.exercises[ei - 1].note || ""));
      if (ei < block.exercises.length - 1) neighborPatterns.push(detectPattern(block.exercises[ei + 1].name, block.exercises[ei + 1].note || ""));
      const neighborPatternLabels = [...new Set(neighborPatterns)].map((p) => PATTERN_LABELS_UK[p] || p);
      const eqStr = blockParams.equipment.length ? blockParams.equipment.join(", ") : "без інвентаря";
      const userPrompt = `Тип блоку: "${blockParams.blockType}", рівень: ${blockParams.level}, обладнання: ${eqStr}.
Заміни вправу "${oldEx.name}" у цьому блоці.
${scheme ? `ВАЖЛИВО: цей блок має спеціальну схему повторень "${scheme}" — заповни "reps" ТОЧНО цим значенням (не заповнюй "sets"), і обери просту вправу на підрахунок повторень — НЕ вправу на дистанцію, час чи складний комплекс.` : ""}
${neighborPatternLabels.length ? `ВАЖЛИВО: сусідні вправи вже мають тип руху "${neighborPatternLabels.join(', ')}" — нова вправа НЕ повинна бути того ж типу.` : ""}
Вже використані вправи, не повторювати: ${usedNames.join(", ")}
Поверни ОДНУ вправу у форматі JSON (без пробілів): {"name":"...","sets":3,"reps":"12-15","note":"..."}`;
      let newEx;
      try {
        newEx = await callClaude(SYSTEM_PROMPT, userPrompt);
      } catch {
        const groups = resolveBlockTypeGroups(blockParams.blockType);
        const basePool = filterLibrary(groups, blockParams.equipment, usedNames);
        const pool = scheme ? filterLadderFriendly(basePool) : basePool;
        const preferred = neighborPatterns.length ? pool.filter((e) => !neighborPatterns.includes(detectPattern(e.name, e.group))) : pool;
        const finalPool = preferred.length ? preferred : (pool.length ? pool : basePool);
        const pick = finalPool[Math.floor(Math.random() * Math.max(1, finalPool.length))];
        newEx = pick
          ? (scheme ? { name: pick.name, sets: null, reps: scheme, note: pick.group } : toWorkoutExercise(pick, blockParams.level))
          : { name: "Планка класична", sets: 3, reps: "45 сек", note: "Прес" };
      }
      if (scheme) {
        newEx = { ...newEx, reps: scheme, sets: null };
      }
      setBlock((b) => {
        const copy = structuredClone(b);
        copy.exercises[ei] = newEx;
        return copy;
      });
    } catch {
      setBlockError("Не вдалось замінити вправу.");
    } finally {
      setBlockReplacingIndex(null);
    }
  }, [block, blockParams]);

  const appendBlockToWorkout = useCallback(() => {
    if (!workout || !block) return;
    setWorkout((w) => {
      const copy = structuredClone(w);
      copy.blocks.push(block);
      return copy;
    });
    setView("workoutResult");
  }, [workout, block]);

  const generatePlan = useCallback(async () => {
    setPlanLoading(true); setPlanError(null);
    const eqStr = planParams.equipment.length ? planParams.equipment.join(", ") : "без інвентаря";
    const themesPool = planParams.themes.length ? planParams.themes : THEMES;
    const weeks = [];
    let usedSummary = "";
    try {
      for (let w = 1; w <= 4; w++) {
        setPlanParams((p) => ({ ...p, progress: w - 1 }));
        const userPrompt = `Склади розклад групових тренувань на тиждень ${w} із ${planParams.sessionsPerWeek} занять.
Рівень групи: ${planParams.level}
Обладнання: ${eqStr}
Теми для ротації: ${themesPool.join(", ")}
${usedSummary ? `Вже було в попередніх тижнях, уникай точних повторів тем поспіль: ${usedSummary}` : ""}
Формат JSON: {"days":[{"day":1,"theme":"...","focus":"коротко до 8 слів","blocks":["...","...","..."]}]}
Кількість днів у масиві: ${planParams.sessionsPerWeek}`;
        let result;
        try {
          result = await callClaude(SYSTEM_PROMPT, userPrompt);
        } catch {
          result = localPlanWeek(themesPool, planParams.sessionsPerWeek, w - 1);
        }
        weeks.push(result);
        usedSummary += ` Тиждень ${w}: ${result.days.map((d) => d.theme).join(", ")}.`;
      }
      const fullPlan = { weeks, params: planParams, createdAt: new Date().toISOString() };
      setPlan(fullPlan);
      try {
        await storageSet("month-plan", JSON.stringify(fullPlan), false);
      } catch {}
      setView("planResult");
    } catch (e) {
      setPlanError(e.message || "Не вдалось скласти план. Спробуй ще раз.");
    } finally {
      setPlanLoading(false);
      setPlanParams((p) => ({ ...p, progress: 0 }));
    }
  }, [planParams]);

  useEffect(() => {
    loadMonthPlan();
    loadSavedWorkouts();
    loadFoldersAndWorkouts();
  }, []);

  // Prevent pinch-zoom and double-tap-zoom so the app feels like a native
  // fixed-scale mobile screen rather than a zoomable web page.
  useEffect(() => {
    const preventPinch = (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); };
    let lastTouchEnd = 0;
    const preventDoubleTapZoom = (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) e.preventDefault();
      lastTouchEnd = now;
    };
    document.addEventListener("touchmove", preventPinch, { passive: false });
    document.addEventListener("touchend", preventDoubleTapZoom, { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    return () => {
      document.removeEventListener("touchmove", preventPinch);
      document.removeEventListener("touchend", preventDoubleTapZoom);
    };
  }, []);

  const tabs = [
    { key: "coach", label: "Тренування", icon: Dumbbell },
    { key: "myFolders", label: "Мої", icon: Folder },
    { key: "library", label: "Бібліотека", icon: LibraryIcon },
    { key: "settings", label: "Налаштування", icon: SettingsIcon },
  ];
  const MY_VIEWS = ["myFolders", "myFolderDetail", "myWorkoutForm", "myWorkoutView"];
  const activeTabKey = tab === "coach" && MY_VIEWS.includes(view) ? "myFolders" : tab;

  let body;
  let backAction = null;
  if (tab === "library") {
    body = <LibraryTab />;
  } else if (tab === "settings") {
    body = <>
      <TopBar title="Налаштування" />
      <SettingsScreen
        onExport={handleExport}
        onImport={handleImport}
        backupMessage={backupMessage}
        backupBusy={backupBusy}
        cloudEnabled={FIREBASE_ENABLED}
        cloudUser={cloudUser}
        cloudBusy={cloudBusy}
        cloudMessage={cloudMessage}
        onCloudSignIn={handleCloudSignIn}
        onCloudSignUp={handleCloudSignUp}
        onCloudSignOut={handleCloudSignOut}
        onCloudGoogleSignIn={handleCloudGoogleSignIn}
      />
    </>;
  } else if (tab === "plan") {
    body = view === "planResult" || plan
      ? <>
          <TopBar title="План на місяць" />
          {view === "planForm" ? (
            <PlanForm onSubmit={generatePlan} loading={planLoading} error={planError} params={planParams} setParams={setPlanParams} />
          ) : (
            <PlanResult plan={plan} onNew={() => { setPlan(null); setView("planForm"); }} />
          )}
        </>
      : <>
          <TopBar title="План на місяць" />
          <PlanForm onSubmit={generatePlan} loading={planLoading} error={planError} params={planParams} setParams={setPlanParams} />
        </>;
  } else {
    // coach tab
    if (view === "home") {
      body = <HomeScreen goto={goto} />;
    } else if (view === "create") {
      backAction = () => goto("home");
      body = <>
        <TopBar title="Створити тренування" onBack={backAction} />
        <ParamsForm params={params} setParams={setParams} onSubmit={generateWorkout} loading={loading} error={error} submitLabel="Згенерувати" />
      </>;
    } else if (view === "savedList") {
      backAction = () => goto("home");
      body = <>
        <TopBar title="Збережені тренування" onBack={backAction} />
        <SavedListScreen savedWorkouts={savedWorkouts} onOpen={openSavedWorkout} onDelete={deleteSavedWorkout} />
      </>;
    } else if (view === "myFolders") {
      const counts = {};
      customWorkouts.forEach((w) => { counts[w.folderId] = (counts[w.folderId] || 0) + 1; });
      backAction = () => goto("home");
      body = <>
        <TopBar title="Мої тренування" onBack={backAction} />
        <FoldersScreen
          folders={folders}
          workoutCounts={counts}
          sortMode={folderSort}
          setSortMode={setFolderSort}
          onCreateFolder={createFolder}
          onOpenFolder={(f) => { setCurrentFolder(f); goto("myFolderDetail"); }}
        />
      </>;
    } else if (view === "myFolderDetail") {
      const workoutsInFolder = customWorkouts.filter((w) => w.folderId === currentFolder?.id);
      backAction = () => goto("myFolders");
      body = <>
        <TopBar title={currentFolder?.name || "Папка"} onBack={backAction} />
        <FolderDetailScreen
          folder={currentFolder}
          workouts={workoutsInFolder}
          sortMode={workoutSort}
          setSortMode={setWorkoutSort}
          onOpenWorkout={(w) => { setCurrentCustomWorkout(w); goto("myWorkoutView"); }}
          onAddWorkout={() => { setCustomDraft(newCustomDraft(currentFolder?.id)); goto("myWorkoutForm"); }}
        />
      </>;
    } else if (view === "myWorkoutForm") {
      backAction = () => goto("myFolderDetail");
      body = <>
        <TopBar title={customDraft?.id ? "Редагувати тренування" : "Нове тренування"} onBack={backAction} />
        {customDraft && (
          <CustomWorkoutForm
            draft={customDraft}
            setDraft={setCustomDraft}
            folders={folders}
            onSave={saveCustomWorkout}
          />
        )}
      </>;
    } else if (view === "myWorkoutView") {
      const folderName = folders.find((f) => f.id === currentCustomWorkout?.folderId)?.name || "";
      backAction = () => goto("myFolderDetail");
      body = <>
        <TopBar title="Тренування" onBack={backAction} />
        {currentCustomWorkout && (
          <CustomWorkoutView
            workout={currentCustomWorkout}
            folderName={folderName}
            onEdit={() => { setCustomDraft(currentCustomWorkout); goto("myWorkoutForm"); }}
            onDelete={() => deleteCustomWorkout(currentCustomWorkout.id)}
          />
        )}
      </>;
    } else if (view === "workoutResult") {
      backAction = () => goto(workoutOrigin === "saved" ? "savedList" : "home");
      body = <>
        <TopBar title="Тренування" onBack={backAction} />
        <WorkoutResult
          workout={workout}
          params={params}
          onReplace={replaceExercise}
          replacingKey={replacingKey}
          onSave={saveWorkout}
          saved={savedFlag}
          usedFallback={usedFallback}
          onRegenerateFinisher={regenerateFinisher}
          finisherLoading={finisherLoading}
          onRegenerateBlock={regenerateBlock}
          blockLoadingIndex={blockLoadingIndex}
          saveError={error}
          onNew={() => goto("create")}
          onAddBlock={() => goto("blockForm")}
        />
      </>;
    } else if (view === "blockForm") {
      backAction = () => goto(workout ? "workoutResult" : "home");
      body = <>
        <TopBar title="Створити блок" onBack={backAction} />
        <BlockForm params={blockParams} setParams={setBlockParams} onSubmit={generateBlock} loading={blockLoading} error={blockError} />
      </>;
    } else if (view === "blockResult") {
      backAction = () => goto("blockForm");
      body = <>
        <TopBar title="Блок готовий" onBack={backAction} />
        <BlockResult
          block={block}
          canAppend={!!workout}
          onAppend={appendBlockToWorkout}
          onNew={() => goto("blockForm")}
          onReplace={replaceBlockExercise}
          replacingIndex={blockReplacingIndex}
        />
      </>;
    } else if (view === "planForm") {
      backAction = () => goto("home");
      body = <>
        <TopBar title="План на місяць" onBack={backAction} />
        <PlanForm onSubmit={generatePlan} loading={planLoading} error={planError} params={planParams} setParams={setPlanParams} />
      </>;
    } else if (view === "planResult") {
      backAction = () => goto("home");
      body = <>
        <TopBar title="План на місяць" onBack={backAction} />
        <PlanResult plan={plan} onNew={() => { setPlan(null); goto("planForm"); }} />
      </>;
    }
  }

  const touchRef = { current: null };
  const handleTouchStart = (e) => {
    const t = e.touches[0];
    touchRef.current = { x: t.clientX, y: t.clientY, time: Date.now() };
  };
  const handleTouchEnd = (e) => {
    if (!touchRef.current || !backAction) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchRef.current.x;
    const dy = t.clientY - touchRef.current.y;
    const dt = Date.now() - touchRef.current.time;
    // Swipe right, starting near the left edge, mostly horizontal, quick enough to be intentional.
    if (touchRef.current.x < 40 && dx > 70 && Math.abs(dy) < 60 && dt < 600) {
      backAction();
    }
    touchRef.current = null;
  };

  return (
    <div
      style={{ background: "#05080D", minHeight: "100vh", maxWidth: 480, margin: "0 auto", position: "relative", paddingBottom: 70 }}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { touch-action: pan-x pan-y; overscroll-behavior: none; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input::placeholder { color: #5C6268; }
      `}</style>

      {body}

      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 480, background: "#1A1D20", borderTop: "1px solid #12191F",
        display: "flex", padding: "10px 10px calc(10px + env(safe-area-inset-bottom))",
      }}>
        {tabs.map((t) => (
          <button
            key={t.key}
            onClick={() => {
              if (t.key === "coach") { setTab("coach"); setView("home"); }
              else if (t.key === "myFolders") { setTab("coach"); setView("myFolders"); }
              else { setTab(t.key); }
            }}
            style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, background: "none", border: "none", padding: 6 }}
          >
            <t.icon size={19} color={activeTabKey === t.key ? "#34E4EA" : "#5C6268"} />
            <span style={{ fontFamily: "'Inter',sans-serif", fontSize: 10, fontWeight: 600, color: activeTabKey === t.key ? "#34E4EA" : "#5C6268" }}>
              {t.label}
            </span>
          </button>
        ))}
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
